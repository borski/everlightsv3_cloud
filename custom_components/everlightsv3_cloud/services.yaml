        object:

schedule_show:
  target:
    entity:
      integration: everlightsv3_cloud
      domain: calendar
  fields:
    name:
      required: true
      example: Holiday lights
      selector:
        text:
    sequences:
      required: true
      example: '{"Candy Cane": 30, "Warm White": 60}'
      selector:
        object:
    start:
      required: true
      example: "2026-12-01 17:00:00"
      selector:
        datetime:
    end:
      required: true
      example: "2026-12-01 23:00:00"
      selector:
        datetime:
    nights:
      default: 1
      selector:
        number:
          min: 1
          max: 366
          mode: box
    start_at_dusk:
      default: false
      selector:
        boolean:
    end_at_dawn:
      default: false
      selector:
        boolean:
    lights:
      selector:
        entity:
          multiple: true
          filter:
            integration: everlightsv3_cloud
            domain: light


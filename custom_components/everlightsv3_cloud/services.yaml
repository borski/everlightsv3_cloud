update_sequence:
  target:
    entity:
      integration: everlightsv3_cloud
      domain: light
  fields:
    name:
      required: true
      example: Candy Cane
      selector:
        text:
    new_name:
      example: Peppermint
      selector:
        text:
    colors:
      example: '["FF0000", "FFFFFF"]'
      selector:
